<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tickets Coming Soon - FS Business Forum</title>
    <meta name="theme-color" content="#040810">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #040810;
            --bg-secondary: #0a1018;
            --accent: #c9a962;
            --accent-light: #e8d5a3;
            --text: #ffffff;
            --text-secondary: #a0a0a5;
        }

        body {
            font-family: 'Inter', -apple-system, sans-serif;
            background: radial-gradient(ellipse at top, #0a1018 0%, #040810 60%);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            overflow: hidden;
            position: relative;
        }

        /* Ambient gold glow */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(201, 169, 98, 0.08) 0%, transparent 70%);
            pointer-events: none;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }

        .container {
            text-align: center;
            max-width: 620px;
            position: relative;
            z-index: 1;
            animation: fadeUp 1s ease forwards;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .tag {
            display: inline-block;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 1.5rem;
            padding-left: 0;
        }

        h1 {
            font-family: 'Playfair Display', serif;
            font-size: clamp(2.5rem, 6vw, 4rem);
            font-weight: 500;
            line-height: 1.1;
            margin-bottom: 1.5rem;
        }

        h1 .accent {
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-style: italic;
        }

        p.lead {
            font-size: 1.15rem;
            color: var(--text-secondary);
            margin-bottom: 2.5rem;
            line-height: 1.7;
        }

        /* Event details */
        .details {
            display: flex;
            justify-content: center;
            gap: 3rem;
            margin-bottom: 3rem;
            flex-wrap: wrap;
        }

        .detail-item .label {
            display: block;
            font-size: 0.7rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 0.4rem;
        }

        .detail-item .value {
            font-size: 1rem;
            color: var(--text);
        }

        .divider {
            width: 60px;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent), transparent);
            margin: 0 auto 2.5rem;
        }

        .btn-group {
            display: flex;
            gap: 1rem;
            justify-content: center;
            flex-wrap: wrap;
        }

        .back-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.9rem 2rem;
            border: 1px solid rgba(201, 169, 98, 0.4);
            color: var(--accent);
            text-decoration: none;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 500;
            letter-spacing: 0.03em;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: var(--accent);
            color: var(--bg);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(201, 169, 98, 0.3);
        }

        .notify-btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.9rem 2rem;
            background: var(--accent);
            color: var(--bg);
            text-decoration: none;
            border-radius: 100px;
            font-size: 0.9rem;
            font-weight: 600;
            letter-spacing: 0.03em;
            transition: all 0.3s ease;
        }

        .notify-btn:hover {
            background: var(--accent-light);
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(201, 169, 98, 0.4);
        }

        @media (max-width: 600px) {
            .details { gap: 1.5rem; }
            p.lead { font-size: 1rem; }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <span class="tag">FS Business Forum 2026</span>

        <h1>Tickets Launching<br><span class="accent">Very Soon</span></h1>

        <p class="lead">
            We're preparing an exceptional experience for you.<br>
            Ticket sales open shortly &mdash; be the first to secure your seat.
        </p>

        <div class="details">
            <div class="detail-item">
                <span class="label">Date</span>
                <span class="value">13 &amp; 14 November 2026</span>
            </div>
            <div class="detail-item">
                <span class="label">Location</span>
                <span class="value">Frankfurt School of Finance &amp; Management</span>
            </div>
        </div>

        <div class="divider"></div>

        <div class="btn-group">
            <a href="index.html" class="back-btn">&larr; Back to Home</a>
            <a href="mailto:info@fs-businessforum.com?subject=Notify%20me%20about%20tickets" class="notify-btn">Notify Me</a>
        </div>
    </div>
</body>
</html>
